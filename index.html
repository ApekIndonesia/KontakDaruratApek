<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kontak Darurat Murid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eef2f5;
  --surface: #ffffff;
  --ink: #13232d;
  --muted: #566a77;
  --line: #d3dde4;
  --accent: #1b5e8c;
  --accent-soft: #dceaf3;
  --call: #18794a;
  --call-ink: #ffffff;
  --warn-bg: #fcebc8;
  --warn-ink: #6b4300;
  --err: #a3281f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e161b;
    --surface: #17232b;
    --ink: #e6eef2;
    --muted: #93a6b2;
    --line: #27363f;
    --accent: #6fb4e3;
    --accent-soft: #1e3544;
    --call: #3db27a;
    --call-ink: #04140b;
    --warn-bg: #3a2d10;
    --warn-ink: #f2c879;
    --err: #ff8f85;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* layar PIN */
.gate { padding-top: clamp(32px, 14vh, 120px); }
.gate h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -0.01em; margin: 0 0 6px; text-wrap: balance; }
.gate .lead { color: var(--muted); margin: 0 0 22px; }
.gate label { display: block; font-weight: 600; margin-bottom: 6px; }
.gate input {
  width: 100%; height: 56px; padding: 0 16px;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--surface); color: var(--ink);
  font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.3em;
  -webkit-appearance: none; appearance: none;
}
.gate input:focus { outline: none; border-color: var(--accent); }
.gate-msg { min-height: 24px; margin: 8px 0 14px; font-size: 15px; color: var(--muted); }
.gate-msg.err { color: var(--err); font-weight: 600; }

/* header + pencarian */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; min-width: 0; }
.tools { display: flex; gap: 6px; flex: none; }
.tool { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--accent); }
.search { position: relative; }
.search input {
  width: 100%; height: 52px; padding: 0 44px 0 16px;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--surface); color: var(--ink);
  font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); }
.search .clear { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; border-radius: 10px; }

/* judul bagian */
.head { padding-block: 14px 10px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; font-weight: 600; }
.head h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; margin: 6px 0 0 -10px; border: 0; background: transparent; color: var(--accent); font-weight: 600; border-radius: 10px; }
.count { font-size: 14px; color: var(--muted); margin: 14px 0 8px; }

/* daftar */
.list { display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; list-style: none; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 64px; padding: 12px 14px 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row:active { background: var(--accent-soft); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.row .t small { display: block; color: var(--muted); font-size: 14px; }
.chev { width: 20px; height: 20px; flex: none; color: var(--muted); transition: transform .18s ease; }

/* murid (akordeon) */
.stu { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stu.open { border-color: var(--accent); }
.stu .hd { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 64px; padding: 10px 14px 10px 12px; border: 0; background: transparent; }
.av { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.stu .t { flex: 1; min-width: 0; }
.stu .t b { display: block; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.stu .t small { display: block; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.stu.open .chev { transform: rotate(90deg); color: var(--accent); }
.stu .bd { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }

.ct { background: var(--bg); border-radius: 10px; padding: 12px; min-width: 0; }
.ct-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ct-top b { font-weight: 600; overflow-wrap: anywhere; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.main { background: var(--warn-bg); color: var(--warn-ink); }
.num { font-family: var(--font-mono); font-weight: 600; font-size: 21px; letter-spacing: 0.01em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.num.none { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
.acts { display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; gap: 8px; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 8px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.call { background: var(--call); border-color: var(--call); color: var(--call-ink); }
.btn.wa { border-color: var(--call); color: var(--call); }
.btn.big { width: 100%; min-height: 54px; font-size: 17px; }
button.btn:disabled { opacity: 0.6; cursor: default; }

.empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; transform: translate(-50%, 12px); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .chev, .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <section id="gate" class="gate">
    <h1>Kontak Darurat Murid</h1>
    <p class="lead">Masukkan PIN staff untuk membuka daftar kontak.</p>
    <form id="pinForm" autocomplete="off">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="go" maxlength="20">
      <p id="gateMsg" class="gate-msg" role="alert"></p>
      <button id="pinBtn" class="btn call big" type="submit">Buka</button>
    </form>
  </section>

  <section id="main" hidden>
    <header class="top">
      <div class="brand">
        <h1>Kontak Darurat Murid</h1>
        <div class="tools">
          <button id="refresh" class="tool" type="button">Perbarui</button>
          <button id="logout" class="tool" type="button">Keluar</button>
        </div>
      </div>
      <div class="search">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="Cari nama murid, perusahaan, kumiai" aria-label="Cari murid">
        <button id="clr" class="clear" type="button" aria-label="Hapus pencarian" hidden>×</button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
  </section>

</div>
<div id="toast" class="toast" role="status"></div>

<script>
(function () {
  var PIN_KEY = "kdm_pin";
  var kumiaiList = [], students = [];
  var state = { k: null, c: null, open: null, q: "" };
  var currentPin = "";

  var gate = document.getElementById("gate");
  var main = document.getElementById("main");
  var pinEl = document.getElementById("pin");
  var pinBtn = document.getElementById("pinBtn");
  var gateMsg = document.getElementById("gateMsg");
  var app = document.getElementById("app");
  var qEl = document.getElementById("q");
  var clr = document.getElementById("clr");
  var toastEl = document.getElementById("toast");

  /* PIN tersimpan di HP ini supaya staff tidak mengetik ulang. Gagal menyimpan tidak masalah. */
  function savedPin() { try { return localStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; } }
  function savePin(p) { try { localStorage.setItem(PIN_KEY, p); } catch (e) {} }
  function forgetPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function fmt(d) {
    if (d.indexOf("62") === 0) { var r = d.slice(2); return "+62 " + r.slice(0, 3) + "-" + r.slice(3, 7) + "-" + r.slice(7); }
    return d;
  }
  function initials(n) { var p = n.split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
  var byName = function (a, b) { return a.nama.localeCompare(b.nama, "id"); };

  /* Kelompokkan baris sheet menjadi kumiai > perusahaan > murid > kontak */
  function build(baris) {
    kumiaiList = []; students = [];
    function pick(arr, name, make) {
      for (var i = 0; i < arr.length; i++) if (arr[i].nama === name) return arr[i];
      var o = make(); arr.push(o); return o;
    }
    baris.forEach(function (r) {
      var k = pick(kumiaiList, r.kumiai, function () { return { nama: r.kumiai, perusahaan: [] }; });
      var c = pick(k.perusahaan, r.perusahaan, function () { return { nama: r.perusahaan, murid: [] }; });
      var m = pick(c.murid, r.murid, function () {
        var s = { id: "s" + students.length, nama: r.murid, perusahaan: r.perusahaan, kumiai: r.kumiai, kontak: [] };
        students.push(s); return s;
      });
      m.kontak.push(r);
    });
    kumiaiList.sort(byName);
    kumiaiList.forEach(function (k) {
      k.perusahaan.sort(byName);
      k.perusahaan.forEach(function (c) {
        c.murid.sort(byName);
        c.murid.forEach(function (m) { m.kontak.sort(function (a, b) { return a.prioritas - b.prioritas; }); });
      });
    });
  }

  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>';
  var BACK = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"/></svg>';

  function contactHTML(t) {
    var h = '<div class="ct"><div class="ct-top"><b>' + esc(t.kontak || "(Tanpa nama)") + '</b>' +
      (t.hubungan ? '<span class="pill">' + esc(t.hubungan) + '</span>' : '') +
      (t.prioritas === 1 ? '<span class="pill main">Kontak utama</span>' : '') + '</div>';
    if (t.telp) {
      h += '<div class="num">' + esc(fmt(t.telp)) + '</div>' +
        (t.catatan ? '<p class="note">' + esc(t.catatan) + '</p>' : '') +
        '<div class="acts">' +
          '<a class="btn call" href="tel:+' + esc(t.telp) + '" target="_top">Telepon</a>' +
          '<a class="btn wa" href="https://wa.me/' + esc(t.telp) + '" target="_blank" rel="noopener">WhatsApp</a>' +
          '<button class="btn" type="button" data-act="copy" data-tel="' + esc(fmt(t.telp)) + '">Salin</button>' +
        '</div>';
    } else {
      h += '<div class="num none">Nomor belum diisi</div>' + (t.catatan ? '<p class="note">' + esc(t.catatan) + '</p>' : '');
    }
    return h + '</div>';
  }
  function studentHTML(s, showWhere) {
    var open = state.open === s.id;
    var sub = showWhere ? esc(s.perusahaan) + ' · ' + esc(s.kumiai) : s.kontak.length + ' kontak keluarga';
    return '<li><div class="stu' + (open ? ' open' : '') + '">' +
      '<button class="hd" type="button" data-act="toggle" data-id="' + s.id + '" aria-expanded="' + open + '">' +
        '<span class="av" aria-hidden="true">' + esc(initials(s.nama)) + '</span>' +
        '<span class="t"><b>' + esc(s.nama) + '</b><small>' + sub + '</small></span>' + CHEV +
      '</button>' +
      '<div class="bd"' + (open ? '' : ' hidden') + '>' + s.kontak.map(contactHTML).join('') + '</div>' +
    '</div></li>';
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    clr.hidden = !state.q;
    var h = "";
    if (!students.length) {
      h = '<div class="empty"><b>Belum ada data murid</b>Isi tab Data di Google Sheets, lalu tekan Perbarui.</div>';
    } else if (q) {
      var hits = students.filter(function (s) {
        var hay = (s.nama + " " + s.perusahaan + " " + s.kumiai + " " + s.kontak.map(function (t) { return t.kontak; }).join(" ")).toLowerCase();
        return q.split(/\s+/).every(function (w) { return hay.indexOf(w) > -1; });
      }).sort(byName);
      h += '<p class="count">' + (hits.length ? hits.length + ' murid ditemukan' : '') + '</p>';
      if (!hits.length) h += '<div class="empty"><b>Tidak ada hasil</b>Periksa ejaan nama, atau hapus kolom pencarian dan telusuri lewat daftar kumiai.</div>';
      else h += '<ul class="list">' + hits.map(function (s) { return studentHTML(s, true); }).join('') + '</ul>';
    } else if (state.k === null) {
      h += '<div class="head"><p class="eyebrow">Langkah 1</p><h2>Pilih kumiai</h2></div><ul class="list">';
      kumiaiList.forEach(function (k, i) {
        var n = k.perusahaan.reduce(function (a, c) { return a + c.murid.length; }, 0);
        h += '<li><button class="row" type="button" data-act="kumiai" data-i="' + i + '"><span class="t"><b>' + esc(k.nama) + '</b><small>' + k.perusahaan.length + ' perusahaan · ' + n + ' murid</small></span>' + CHEV + '</button></li>';
      });
      h += '</ul>';
    } else if (state.c === null) {
      var k = kumiaiList[state.k];
      h += '<button class="back" type="button" data-act="back">' + BACK + 'Semua kumiai</button>' +
        '<div class="head"><p class="eyebrow">Kumiai · pilih perusahaan</p><h2>' + esc(k.nama) + '</h2></div><ul class="list">';
      k.perusahaan.forEach(function (c, i) {
        h += '<li><button class="row" type="button" data-act="company" data-i="' + i + '"><span class="t"><b>' + esc(c.nama) + '</b><small>' + c.murid.length + ' murid</small></span>' + CHEV + '</button></li>';
      });
      h += '</ul>';
    } else {
      var k2 = kumiaiList[state.k], c2 = k2.perusahaan[state.c];
      h += '<button class="back" type="button" data-act="back">' + BACK + esc(k2.nama) + '</button>' +
        '<div class="head"><p class="eyebrow">' + esc(k2.nama) + ' · pilih murid</p><h2>' + esc(c2.nama) + '</h2></div>' +
        '<ul class="list">' + c2.murid.map(function (m) { return studentHTML(m, false); }).join('') + '</ul>';
    }
    app.innerHTML = h;
  }

  /* layar PIN dan pemuatan data */
  function showGate(msg, opts) {
    opts = opts || {};
    main.hidden = true; gate.hidden = false;
    gateMsg.textContent = msg || "";
    gateMsg.className = "gate-msg" + (opts.err ? " err" : "");
    pinBtn.disabled = !!opts.busy;
    pinBtn.textContent = opts.busy ? "Memeriksa…" : (opts.retry ? "Coba lagi" : "Buka");
  }
  function showMain() { gate.hidden = true; main.hidden = false; }

  /* Tempel alamat web app Apps Script (berakhiran /exec) di antara tanda kutip. */
  var API_URL = "https://script.google.com/macros/s/AKfycbxcysA9dzR8HC_qLJXjjjrAHOQJOZvuycfX113iBMeo2zCMWXA1EEulkNCBmvQ6nQ5b/exec";

  function load(pin, auto, refreshing) {
    if (API_URL.indexOf("https://script.google.com/") !== 0) {
      showGate("Alamat web app Apps Script belum diisi di file index.html.", { err: true });
      return;
    }
    if (!refreshing) showGate(auto ? "Memuat data…" : "", { busy: true });
    fetch(API_URL, { method: "POST", body: JSON.stringify({ pin: pin }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { onResult(res, pin, auto, refreshing); })
      .catch(function () { onFail(refreshing); });
  }
  function onResult(res, pin, auto, refreshing) {
    if (res && res.ok) {
      currentPin = pin; savePin(pin); build(res.baris || []);
      state.k = null; state.c = null; state.open = null;
      showMain(); render();
      if (refreshing) toast("Data diperbarui");
      return;
    }
    var why = res && res.alasan;
    currentPin = "";
    if (why === "pin") {
      forgetPin();
      showGate(auto || refreshing ? "PIN sudah diganti atau tidak cocok. Masukkan PIN yang baru." : "PIN salah. Coba lagi.", { err: true });
    } else if (why === "terkunci") {
      showGate("Terlalu banyak PIN salah. Tunggu 10 menit lalu coba lagi.", { err: true });
    } else if (why === "tab") {
      showGate("Sheet belum lengkap. Pastikan ada tab bernama Data dan Pengaturan.", { err: true });
    } else {
      showGate("Data belum bisa dibaca. Coba lagi sebentar lagi.", { err: true, retry: true });
    }
  }
  function onFail(refreshing) {
    if (refreshing) { toast("Gagal memperbarui. Periksa sinyal."); return; }
    showGate("Tidak dapat memuat data. Periksa sinyal lalu coba lagi.", { err: true, retry: true });
  }

  document.getElementById("pinForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var p = pinEl.value.trim() || savedPin();
    if (!p) { showGate("Masukkan PIN dulu.", { err: true }); return; }
    pinEl.value = "";
    load(p, false, false);
  });
  document.getElementById("refresh").addEventListener("click", function () { load(currentPin || savedPin(), true, true); });
  document.getElementById("logout").addEventListener("click", function () {
    forgetPin(); currentPin = ""; students = []; kumiaiList = [];
    qEl.value = ""; state = { k: null, c: null, open: null, q: "" };
    showGate("Anda sudah keluar. Masukkan PIN untuk membuka lagi.");
  });

  var tt;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }
  function selectText(el) {
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "kumiai") { state.k = +el.getAttribute("data-i"); state.c = null; state.open = null; render(); window.scrollTo(0, 0); }
    else if (act === "company") { state.c = +el.getAttribute("data-i"); state.open = null; render(); window.scrollTo(0, 0); }
    else if (act === "back") { if (state.c !== null) state.c = null; else state.k = null; state.open = null; render(); window.scrollTo(0, 0); }
    else if (act === "toggle") {
      var id = el.getAttribute("data-id");
      state.open = state.open === id ? null : id; render();
      var hd = app.querySelector('[data-id="' + id + '"]'); if (hd && state.open) hd.scrollIntoView({ block: "nearest" });
    }
    else if (act === "copy") {
      var tel = el.getAttribute("data-tel");
      var numEl = el.closest(".ct").querySelector(".num");
      var done = function () { toast("Nomor disalin"); };
      var fail = function () { selectText(numEl); toast("Tekan lama nomor untuk menyalin"); };
      try { navigator.clipboard.writeText(tel).then(done, fail); } catch (err) { fail(); }
    }
  });
  qEl.addEventListener("input", function () { state.q = qEl.value; state.open = null; render(); });
  clr.addEventListener("click", function () { qEl.value = ""; state.q = ""; state.open = null; render(); qEl.focus(); });

  /* mulai */
  var saved = savedPin();
  if (saved) load(saved, true, false);
  else showGate("");
})();
</script>
</body>
</html>
